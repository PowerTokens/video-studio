name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PowerTokensVideoStudio --icon assets/logo.ico --add-data "assets;assets" app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PowerTokensVideoStudio-Windows
          path: dist/PowerTokensVideoStudio.exe
          if-no-files-found: error
